<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker on Android — 跑通了</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(ellipse at 30% 0%, #1b2735 0%, #090a0f 60%);
    color: #e8eaed;
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .card {
    max-width: 520px; width: 100%; text-align: center;
    padding: 44px 36px 38px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 18px;
    backdrop-filter: blur(12px);
  }
  .check {
    width: 62px; height: 62px; margin: 0 auto 26px;
    border-radius: 50%; display: grid; place-items: center;
    background: rgba(53,200,138,.12);
    border: 1px solid rgba(53,200,138,.35);
    color: #35c88a; font-size: 30px; font-weight: 300;
  }
  h1 { font-size: 23px; font-weight: 500; letter-spacing: -.01em; margin-bottom: 10px; }
  .lead { color: #8b919c; font-size: 14px; margin-bottom: 30px; }
  .rows { text-align: left; border-top: 1px solid rgba(255,255,255,.08); padding-top: 18px; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; font-size: 13px; }
  .row span:first-child { color: #8b919c; }
  .row span:last-child {
    font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
    color: #c8ccd4; word-break: break-all; text-align: right;
  }
  .hint {
    margin-top: 26px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.08);
    font-size: 12px; color: #6b7280; line-height: 1.8;
  }
  code {
    font-family: ui-monospace, Menlo, monospace; font-size: 11.5px;
    background: rgba(255,255,255,.06); padding: 2px 6px; border-radius: 4px; color: #a8c7fa;
  }
</style>
</head>
<body>
<div class="card">
  <div class="check">✓</div>
  <h1>Docker 在手机上跑起来了</h1>
  <div class="lead">你现在看到的这个页面，是一个 nginx 容器提供的。</div>

  <div class="rows">
    <div class="row"><span>服务端</span><span>nginx:alpine</span></div>
    <div class="row"><span>挂载来源</span><span>./html → /usr/share/nginx/html</span></div>
    <div class="row"><span>访问地址</span><span id="addr">—</span></div>
    <div class="row"><span>渲染时间</span><span id="time">—</span></div>
  </div>

  <div class="hint">
    这个页面就是 <code>examples/nginx/html/index.html</code><br>
    改它、刷新，内容立刻变——说明 volume 挂载正常
  </div>
</div>
<script>
  document.getElementById('time').textContent = new Date().toLocaleString('zh-CN');
  document.getElementById('addr').textContent = location.host;
</script>
</body>
</html>
